# CYBERDECK · picom
# Настройки — из github.com/sasha-sup/dotfiles (picom/picom.conf), в теме Nord:
# квадратные углы, без прозрачности и размытия, тени у всех окон, кроме панели
# и уведомлений. Тень — нейтральная чёрная: на фоне nord0 и обоях Nord она
# читается как глубина, а не как цветной ореол.

# === Shadows ===
shadow = true;
shadow-radius = 14;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.5;
shadow-color = "#000000";
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Dunst'",
    "class_g = 'Polybar'",
    "class_g = 'xob'",
    "class_g = 'i3-frame'",
    "window_type = 'tooltip'",
    "_GTK_FRAME_EXTENTS@",
    "_NET_WM_STATE@[0]:32a *= '_NET_WM_STATE_HIDDEN'"
];

# === Fading ===
# Выключено: окна появляются мгновенно
fading = false;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 5;

# === Transparency ===
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

focus-exclude = [
    "class_g = 'Rofi'",
    "class_g = 'dmenu'"
];

# === Blur ===
# Размытия нет: kitty рисует обои сам, панель полупрозрачна без размытия
blur-background = false;

# === Corners ===
# Квадратные углы — как рамки i3 и вся тема Cyberdeck
corner-radius = 0;
rounded-corners-exclude = [ ];

# === General ===
# glx — композитинг на встроенной Radeon (а не на CPU внутри X-сервера),
# vsync — без разрывов и без перерисовки чаще частоты экрана.
backend = "glx";
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
# Полноэкранные окна (видео, игры) — мимо композитора: меньше задержка и расход батареи
unredir-if-possible = true;

wintypes: {
  dock          = { shadow = false; clip-shadow-above = true; };
  dnd           = { shadow = false; };
  tooltip       = { shadow = false; };
};
