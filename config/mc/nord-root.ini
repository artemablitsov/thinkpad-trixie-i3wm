# CYBERDECK · mc skin «nord-root» — для root: Nord, перекрашенный в бордовый.
# Сразу видно, что mc работает от имени root (sudo mc, su -). Цвета 24-битные
# (truecolors): kitty их умеет; sudo передаёт COLORTERM (sudoers.d/cyberdeck-root).
# Где 24-битного цвета нет (текстовая консоль), выбирается 16-цветный nord-root16:
# это решают /usr/local/bin/mc (sudo mc) и ~/.bashrc root (su -, sudo -i).
#
# Палитра «Nord Root»: фон и рамки — бордовые тона вместо Polar Night,
# акценты — розово-бордовые вместо Frost, текст — Snow Storm, как в Nord.
#   r0 #2B1D23 фон        r1 #3A262E панели диалогов   r2 #4A2F3A выделение
#   r3 #6B4655 рамки      e7 #E8B4BC  e8 #E08A97  e9 #C9677A  e10 #A23B55
#   snow #D8DEE9 #E5E9F0 #ECEFF4   aurora: red #BF616A yellow #EBCB8B green #A3BE8C purple #B48EAD

[skin]
    description = Cyberdeck Nord Root (burgundy, for root)
    256colors = true
    truecolors = true

[aliases]
    r0 = #2b1d23
    r1 = #3a262e
    r2 = #4a2f3a
    r3 = #6b4655
    e7 = #e8b4bc
    e8 = #e08a97
    e9 = #c9677a
    e10 = #a23b55
    s0 = #d8dee9
    s1 = #e5e9f0
    s2 = #eceff4
    red = #bf616a
    orange = #d08770
    yellow = #ebcb8b
    green = #a3be8c
    purple = #b48ead
    muted = #8f6b78

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[core]
    _default_ = s0;r0
    selected = s2;e10;bold
    marked = yellow;r0;bold
    markselect = yellow;e10;bold
    gauge = r0;e8
    input = s1;r1
    inputunchanged = muted;r1
    inputmark = r0;e8
    disabled = muted;r0
    reverse = s2;e10
    commandlinemark = s2;e10
    header = e8;r0;bold
    inputhistory = s0;r0
    commandhistory = s0;r0
    shadow = r3;r0
    frame = e10;r0

[dialog]
    _default_ = s0;r1
    dfocus = s2;e10;bold
    dhotnormal = e8;r1
    dhotfocus = s2;e10;bold
    dselnormal = s2;e10
    dselfocus = r0;e8
    dtitle = e8;r1;bold
    dframe = e9;r1

[error]
    _default_ = s2;#7a1f35
    errdfocus = #7a1f35;s2
    errdhotnormal = yellow;#7a1f35
    errdhotfocus = #7a1f35;s2;bold
    errdtitle = s2;#7a1f35;bold
    errdframe = s2;#7a1f35

[filehighlight]
    directory = e8;;bold
    executable = green;
    symlink = e7;
    hardlink = e7;
    stalelink = red;
    device = purple;
    special = yellow;
    core = red;
    temp = muted;
    archive = purple;
    doc = e7;
    source = s0;
    media = yellow;
    graph = purple;
    database = orange;

[menu]
    _default_ = s0;r1
    menusel = s2;e10;bold
    menuhot = e8;r1
    menuhotsel = s2;e10;bold
    menuinactive = muted;r1
    menuframe = e9;r1

[popupmenu]
    _default_ = s0;r1
    menusel = s2;e10
    menutitle = e8;r1;bold
    menuframe = e9;r1

[buttonbar]
    hotkey = e8;r0;bold
    button = s0;r1

[statusbar]
    _default_ = s0;r1

[help]
    _default_ = s0;r1
    helpitalic = e8;r1
    helpbold = s2;r1;bold
    helplink = e7;r1;underline
    helpslink = s2;e10
    helptitle = e8;r1;bold
    helpframe = e9;r1

[editor]
    _default_ = s0;r0
    editbold = s2;r0;bold
    editmarked = s2;r2
    editwhitespace = r3;r0
    editnonprintable = r3;r0
    editlinestate = muted;r0
    bookmark = r0;yellow
    bookmarkfound = r0;green
    editrightmargin = r3;r0
    editframe = r3;r0
    editframeactive = e8;r0
    editframedrag = yellow;r0

[viewer]
    _default_ = s0;r0
    viewbold = s2;r0;bold
    viewunderline = e8;r0;underline
    viewboldunderline = e7;r0;bold
    viewselected = s2;e10
    viewframe = r3;r0

[diffviewer]
    added = green;r1
    changedline = e8;r1
    changednew = yellow;r1
    changed = s0;r1
    removed = red;r1
    error = s2;#7a1f35

[widget-common]
    sort-sign-up = ↑
    sort-sign-down = ↓

[widget-panel]
    hiddenfiles-sign-show = •
    hiddenfiles-sign-hide = ○
    history-prev-item-sign = «
    history-next-item-sign = »
    history-show-list-sign = ^
    filename-scroll-left-char = «
    filename-scroll-right-char = »

[widget-scollbar]
    first-vert-char = ↑
    last-vert-char = ↓
    first-horiz-char = «
    last-horiz-char = »
    current-char = ■
    background-char = ▒
