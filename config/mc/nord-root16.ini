# CYBERDECK · mc skin «nord-root16» — root в текстовой консоли (16 цветов):
# раскладка nord.ini, акцент красный (nord11) вместо голубого. Его выбирают
# /usr/local/bin/mc и ~/.bashrc root, когда у терминала нет 24-битного цвета.
#
# Использует 16 цветов терминала (в kitty и TTY это палитра Nord), поэтому
# одинаково выглядит и в графике, и в консоли.
# black=nord1  gray=nord3  red=nord11 (акцент)  brightred=nord11  lightgray=nord5  white=nord6

[skin]
    description = Cyberdeck Nord Root, 16 colours
    256colors = false

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[core]
    _default_ = lightgray;default
    selected = black;red
    marked = yellow;default;bold
    markselect = yellow;red;bold
    gauge = black;red
    input = lightgray;black
    inputunchanged = gray;black
    inputmark = black;red
    disabled = gray;default
    reverse = black;red
    commandlinemark = black;red
    header = red;default;bold
    inputhistory = lightgray;default
    commandhistory = lightgray;default
    shadow = gray;black
    frame = red;default

[dialog]
    _default_ = lightgray;black
    dfocus = black;red
    dhotnormal = red;black
    dhotfocus = black;red;bold
    dselnormal = black;red
    dselfocus = black;brightred
    dtitle = red;black;bold
    dframe = gray;black

[error]
    _default_ = white;red
    errdfocus = red;white
    errdhotnormal = yellow;red
    errdhotfocus = red;white;bold
    errdtitle = white;red;bold
    errdframe = white;red

[filehighlight]
    directory = brightred;;bold
    executable = green;
    symlink = red;
    hardlink = red;
    stalelink = red;
    device = magenta;
    special = yellow;
    core = red;
    temp = gray;
    archive = magenta;
    doc = brightcyan;
    source = lightgray;
    media = yellow;
    graph = brightmagenta;
    database = brightblue;

[menu]
    _default_ = lightgray;black
    menusel = black;red
    menuhot = red;black
    menuhotsel = black;red;bold
    menuinactive = gray;black
    menuframe = gray;black

[popupmenu]
    _default_ = lightgray;black
    menusel = black;red
    menutitle = red;black;bold
    menuframe = gray;black

[buttonbar]
    hotkey = red;default
    button = gray;default

[statusbar]
    _default_ = lightgray;black

[help]
    _default_ = lightgray;black
    helpitalic = red;black
    helpbold = white;black;bold
    helplink = blue;black;underline
    helpslink = black;red
    helptitle = red;black;bold
    helpframe = gray;black

[editor]
    _default_ = lightgray;default
    editbold = white;default;bold
    editmarked = black;red
    editwhitespace = gray;default
    editnonprintable = gray;default
    editlinestate = gray;default
    bookmark = black;yellow
    bookmarkfound = black;green
    editrightmargin = gray;default
    editframe = gray;default
    editframeactive = red;default
    editframedrag = yellow;default

[viewer]
    _default_ = lightgray;default
    viewbold = white;default;bold
    viewunderline = red;default;underline
    viewboldunderline = brightred;default;bold
    viewselected = black;red
    viewframe = gray;default

[diffviewer]
    added = green;black
    changedline = blue;black
    changednew = yellow;black
    changed = lightgray;black
    removed = red;black
    error = white;red

[widget-common]
    sort-sign-up = ↑
    sort-sign-down = ↓

[widget-panel]
    hiddenfiles-sign-show = •
    hiddenfiles-sign-hide = ○
    history-prev-item-sign = «
    history-next-item-sign = »
    history-show-list-sign = ^
    filename-scroll-left-char = «
    filename-scroll-right-char = »

[widget-scollbar]
    first-vert-char = ↑
    last-vert-char = ↓
    first-horiz-char = «
    last-horiz-char = »
    current-char = ■
    background-char = ▒
