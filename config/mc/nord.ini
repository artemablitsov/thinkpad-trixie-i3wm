# CYBERDECK · mc skin «nord»
# Использует 16 цветов терминала (в kitty и TTY это палитра Nord), поэтому
# одинаково выглядит и в графике, и в консоли.
# black=nord1  gray=nord3  blue=nord9  cyan=nord8  brightcyan=nord7  lightgray=nord5  white=nord6

[skin]
    description = Cyberdeck Nord
    256colors = false

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[core]
    _default_ = lightgray;default
    selected = black;cyan
    marked = yellow;default;bold
    markselect = yellow;cyan;bold
    gauge = black;cyan
    input = lightgray;black
    inputunchanged = gray;black
    inputmark = black;cyan
    disabled = gray;default
    reverse = black;cyan
    commandlinemark = black;cyan
    header = cyan;default;bold
    inputhistory = lightgray;default
    commandhistory = lightgray;default
    shadow = gray;black
    frame = gray;default

[dialog]
    _default_ = lightgray;black
    dfocus = black;cyan
    dhotnormal = cyan;black
    dhotfocus = black;cyan;bold
    dselnormal = black;cyan
    dselfocus = black;brightcyan
    dtitle = cyan;black;bold
    dframe = gray;black

[error]
    _default_ = white;red
    errdfocus = red;white
    errdhotnormal = yellow;red
    errdhotfocus = red;white;bold
    errdtitle = white;red;bold
    errdframe = white;red

[filehighlight]
    directory = blue;;bold
    executable = green;
    symlink = cyan;
    hardlink = cyan;
    stalelink = red;
    device = magenta;
    special = yellow;
    core = red;
    temp = gray;
    archive = magenta;
    doc = brightcyan;
    source = lightgray;
    media = yellow;
    graph = brightmagenta;
    database = brightblue;

[menu]
    _default_ = lightgray;black
    menusel = black;cyan
    menuhot = cyan;black
    menuhotsel = black;cyan;bold
    menuinactive = gray;black
    menuframe = gray;black

[popupmenu]
    _default_ = lightgray;black
    menusel = black;cyan
    menutitle = cyan;black;bold
    menuframe = gray;black

[buttonbar]
    hotkey = cyan;default
    button = gray;default

[statusbar]
    _default_ = lightgray;black

[help]
    _default_ = lightgray;black
    helpitalic = cyan;black
    helpbold = white;black;bold
    helplink = blue;black;underline
    helpslink = black;cyan
    helptitle = cyan;black;bold
    helpframe = gray;black

[editor]
    _default_ = lightgray;default
    editbold = white;default;bold
    editmarked = black;cyan
    editwhitespace = gray;default
    editnonprintable = gray;default
    editlinestate = gray;default
    bookmark = black;yellow
    bookmarkfound = black;green
    editrightmargin = gray;default
    editframe = gray;default
    editframeactive = cyan;default
    editframedrag = yellow;default

[viewer]
    _default_ = lightgray;default
    viewbold = white;default;bold
    viewunderline = cyan;default;underline
    viewboldunderline = brightcyan;default;bold
    viewselected = black;cyan
    viewframe = gray;default

[diffviewer]
    added = green;black
    changedline = blue;black
    changednew = yellow;black
    changed = lightgray;black
    removed = red;black
    error = white;red

[widget-common]
    sort-sign-up = ↑
    sort-sign-down = ↓

[widget-panel]
    hiddenfiles-sign-show = •
    hiddenfiles-sign-hide = ○
    history-prev-item-sign = «
    history-next-item-sign = »
    history-show-list-sign = ^
    filename-scroll-left-char = «
    filename-scroll-right-char = »

[widget-scollbar]
    first-vert-char = ↑
    last-vert-char = ↓
    first-horiz-char = «
    last-horiz-char = »
    current-char = ■
    background-char = ▒
