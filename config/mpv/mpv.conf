# CYBERDECK · mpv
hwdec=auto-safe
vo=gpu
keep-open=no
save-position-on-quit=yes
volume=80
volume-max=150
osd-font="JetBrainsMono Nerd Font"
osd-font-size=28
osd-color="#D8DEE9"
osd-border-color="#2E3440"
osd-bar-h=1.5
term-osd-bar=yes
term-osd-bar-chars="[━━ ]"
sub-font="Noto Sans"
sub-color="#ECEFF4"
sub-border-color="#2E3440"
slang=ru,rus,en,eng
alang=ru,rus,en,eng
screenshot-directory=~/Pictures/Screenshots
