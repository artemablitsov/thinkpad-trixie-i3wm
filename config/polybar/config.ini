;┌──────────────────────────────────────────┐
;│ CYBERDECK · polybar                      │
;└──────────────────────────────────────────┘

[colors]
bg      = #2E3440
bg-alt  = #3B4252
fg      = #D8DEE9
fg-dim  = #4C566A
accent  = #88C0D0
blue    = #81A1C1
teal    = #8FBCBB
green   = #A3BE8C
yellow  = #EBCB8B
orange  = #D08770
red     = #BF616A
purple  = #B48EAD
; Фон панели: 70 % непрозрачности (b3), без размытия — полностью прозрачная
; теряется на светлых местах обоев. Альфа работает при запущенном picom.
bar-bg  = #b32E3440

[bar/top]
monitor = ${env:MONITOR:}
width = 100%
; Размеры — по масштабу экрана (launch.sh: CD_SCALE, 100 % = 28 px и шрифт 15 px)
height = ${env:CD_BAR_HEIGHT:28}
bottom = false
; false — часы по центру свободного места: длинная правая часть их не наезжает
fixed-center = false
background = ${colors.bar-bg}
foreground = ${colors.fg}
line-size = ${env:CD_BAR_LINE:2}
padding-left = 0
padding-right = 0
module-margin = 0
; Моноширинный «Mono»-вариант Nerd Font: иконки шириной в один символ,
; pixelsize=15 даёт ровно 9 px на символ (600/1000 em). Строки шрифтов целиком
; собирает launch.sh (ссылка ${env:…} работает только на всё значение).
font-0 = ${env:CD_BAR_FONT0:JetBrainsMono Nerd Font Mono:style=Regular:pixelsize=15;3}
font-1 = ${env:CD_BAR_FONT1:JetBrainsMono Nerd Font Mono:style=Bold:pixelsize=15;3}
modules-left = i3
modules-center = clock
modules-right = status keyboard battery
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3
override-redirect = false

; Остальные мониторы: только рабочие столы этого монитора (pin-workspaces) —
; часы, состояние и батарея — на основном (launch.sh)
[bar/side]
inherit = bar/top
modules-center =
modules-right =

; ── 3.1.1 Рабочие столы ───────────────────────
[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
format = <label-state> <label-mode>
label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.yellow}
label-mode-foreground = ${colors.bg}
label-focused = %name%
label-focused-padding = 1
label-focused-foreground = ${colors.bg}
label-focused-background = ${colors.accent}
label-focused-font = 2
label-unfocused = %name%
label-unfocused-padding = 1
label-unfocused-foreground = ${colors.fg}
label-visible = %name%
label-visible-padding = 1
label-visible-underline = ${colors.blue}
label-urgent = %name%
label-urgent-padding = 1
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.bg}

; ── 3.1.2 Часы: дата, день недели по-русски, время (обновляется раз в минуту) ──
[module/clock]
type = custom/script
exec = ~/.config/polybar/scripts/clock.sh
tail = true
format = <label>
format-padding = 1
click-left = cyberdeck-popup calendar ikhal

; ── 3.1.3–3.1.8 Сеть, Bluetooth, звук, CPU, RAM, температура, батарея ──
; Один скрипт расставляет значки и клики; батарея — его второй экземпляр (module/battery).
[module/status]
type = custom/script
exec = ~/.config/polybar/scripts/status.sh
tail = true
format = <label>

; ── 3.1.9 Раскладка ───────────────────────────
[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/status.sh battery
tail = true
format = <label>

[module/keyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
blacklist-2 = caps lock
format = <label-layout>
format-padding = 1
label-layout = %icon%
layout-icon-default = --
layout-icon-0 = us;EN
layout-icon-1 = ru;RU

[settings]
screenchange-reload = true
pseudo-transparency = false

; vim:ft=dosini
