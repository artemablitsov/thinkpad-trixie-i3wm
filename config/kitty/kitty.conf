# CYBERDECK · kitty
# Настройки — из github.com/sasha-sup/dotfiles (kitty/kitty.conf),
# палитра Cyberpunk заменена на Nord, фоновая картинка убрана.

font_family JetBrainsMono Nerd Font
font_size 14.0

# ── Nord ──────────────────────────────────────
foreground #D8DEE9
background #2E3440
# Как у sasha-sup: не настоящая прозрачность, а текущие обои внутри окна,
# затемнённые на 95 % фоном — еле заметный узор, текст читается как на сплошном.
background_image ~/.local/share/cyberdeck/wallpaper.png
# cscaled — без искажения пропорций в узких окнах
background_image_layout cscaled
background_tint 0.95

cursor #D8DEE9
cursor_text_color #2E3440

selection_foreground #2E3440
selection_background #88C0D0

url_color #8FBCBB

# color8 заметно светлее фона: htop рисует им приглушённый текст и шкалы
color0  #3B4252
color1  #BF616A
color2  #A3BE8C
color3  #EBCB8B
color4  #81A1C1
color5  #B48EAD
color6  #88C0D0
color7  #E5E9F0
color8  #4C566A
color9  #BF616A
color10 #A3BE8C
color11 #EBCB8B
color12 #81A1C1
color13 #B48EAD
color14 #8FBCBB
color15 #ECEFF4

# Рамки сплитов и вкладки
active_border_color     #88C0D0
inactive_border_color   #3B4252
bell_border_color       #EBCB8B
active_tab_foreground   #2E3440
active_tab_background   #88C0D0
active_tab_font_style   bold
inactive_tab_foreground #D8DEE9
inactive_tab_background #3B4252
tab_bar_background      #2E3440

# ── Поведение ─────────────────────────────────
scrollback_lines -1
copy_on_select clipboard
mouse_map right press ungrabbed
mouse_map right release ungrabbed paste_from_selection
confirm_os_window_close 0
enable_audio_bell no
update_check_interval 0

hide_window_decorations yes
window_padding_width 10
draw_minimal_borders yes

enabled_layouts splits,tall,stack
tab_bar_edge top

# ── Сплиты в стиле Terminator ─────────────────
map ctrl+shift+o launch --location=hsplit --cwd=current --copy-env
map ctrl+shift+e launch --location=vsplit --cwd=current --copy-env

map ctrl+shift+z toggle_layout stack

map alt+up neighboring_window up
map alt+down neighboring_window down
map alt+left neighboring_window left
map alt+right neighboring_window right

map ctrl+page_down next_tab
map ctrl+page_up previous_tab
