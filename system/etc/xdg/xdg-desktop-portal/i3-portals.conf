# Cyberdeck: XDG Desktop Portal в сессии i3 (XDG_CURRENT_DESKTOP=i3) — бэкенд GTK.
# Через портал Flutter-приложения (Hiddify), Electron и GTK4 узнают о тёмной
# схеме (org.freedesktop.appearance color-scheme ← gsettings color-scheme
# prefer-dark). Без портала Flutter смотрит только на имя GTK-темы: тёмной
# считается тема с «-dark» в конце, а «Nordic» — нет, и Hiddify был светлым.
[preferred]
default=gtk
