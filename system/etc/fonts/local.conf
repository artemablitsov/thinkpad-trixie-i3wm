<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Cyberdeck: шрифты по умолчанию.
     Как в github.com/sasha-sup/dotfiles: моноширинный — JetBrainsMono Nerd Font,
     эмодзи — Noto Color Emoji (а не чёрно-белый Symbola). -->
<fontconfig>
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>Symbola</string></patelt></pattern>
    </rejectfont>
  </selectfont>
  <alias>
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Noto Sans</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Noto Serif</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>JetBrainsMono Nerd Font</family><family>JetBrains Mono</family><family>Noto Color Emoji</family></prefer>
  </alias>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
