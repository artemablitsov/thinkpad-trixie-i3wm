# Cyberdeck — политика питания. После правки: sudo systemctl restart cyberdeck-lidd
# и перелогиньтесь (или: pkill -f cyberdeck-idle; cyberdeck-idle &).
# Все времена отсчитываются от начала бездействия / закрытия крышки.

# Крышка открыта (сеть и батарея одинаково)
IDLE_SCREEN_OFF_MIN=5
IDLE_LOCK_MIN=10
IDLE_SLEEP_MIN=30

# Крышка закрыта
LID_LOCK_MIN=1
LID_SLEEP_MIN=15

# Гибернация через N минут от начала бездействия / закрытия крышки
HIBERNATE_AFTER_MIN=180

# Куда гибернация пишет память: auto — в swap-раздел (его создаёт установщик
# Debian), если он не меньше 60 % RAM, иначе в swap-файл; partition; file.
# После смены: sudo ./install.sh --only power
HIBERNATE_SWAP=auto

# Размер swap-файла в ГБ (пусто = RAM + 4), если гибернация идёт в файл
SWAP_GB=

# Пороги заряда батареи ThinkPad (пусто = не трогать). Пример: 75 и 85.
BAT_START_THRESHOLD=
BAT_STOP_THRESHOLD=

# Защита от перегрева (cyberdeck-thermal): при THERMAL_HOT °C дольше THERMAL_HOT_SEC
# включается power-saver; при THERMAL_COOL °C дольше THERMAL_COOL_SEC — прежний профиль
THERMAL_HOT=90
THERMAL_COOL=75
THERMAL_HOT_SEC=30
THERMAL_COOL_SEC=60
