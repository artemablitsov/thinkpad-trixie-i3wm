# Cyberdeck: звуковой кодек засыпает через 1 с тишины (PipeWire сам отпускает
# устройство через 5 с без звука). Модели с щелчками при пробуждении ядро
# знает (power_save_denylist) и для них энергосбережение не включает.
# Вернуть как было: удалить этот файл и перезагрузиться.
options snd_hda_intel power_save=1 power_save_controller=Y
