# Cyberdeck: дискретная NVIDIA (проприетарный драйвер), ставит модуль hardware.
#   PreserveVideoMemoryAllocations — видеопамять сохраняется при сне и гибернации
#     (вместе со службами nvidia-suspend/-hibernate/-resume), без порчи картинки;
#   TemporaryFilePath — куда её сохранять (на диск, а не в tmpfs);
#   DynamicPowerManagement=0x02 — в простое карта полностью выключается
#     (RTD3, Turing и новее; на старых параметр игнорируется).
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp NVreg_DynamicPowerManagement=0x02
# KMS для nvidia-drm — нужен PRIME (prime-run) и корректному выходу из сна
options nvidia-drm modeset=1
