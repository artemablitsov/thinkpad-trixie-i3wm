#!/usr/sbin/nft -f
# Cyberdeck — файрвол ноутбука.
# Входящие соединения запрещены, исходящие разрешены, ответы на исходящие проходят.
#
# Важно: правила живут в своей таблице «inet cyberdeck». Общего «flush ruleset» нет,
# поэтому перезагрузка файрвола не стирает правила Docker и libvirt.
#
# Открыть порт (например, ssh): создайте /etc/cyberdeck/nftables.d/ssh.nft с
#   add rule inet cyberdeck allow tcp dport 22 accept
# и выполните: sudo systemctl reload nftables

table inet cyberdeck
delete table inet cyberdeck

table inet cyberdeck {
    # Сюда добавляются правила из /etc/cyberdeck/nftables.d/*.nft
    chain allow {
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif "lo" accept

        # ICMP: ping, path MTU, ошибки; для IPv6 ещё и обнаружение соседей —
        # без него IPv6 не работает
        meta l4proto icmp accept
        meta l4proto ipv6-icmp accept

        # DHCPv6-клиент (ответы приходят на link-local)
        ip6 saddr fe80::/10 udp dport 546 accept

        # Виртуальные сети на самом ноутбуке (Docker, libvirt, контейнеры):
        # контейнеру нужен DNS/DHCP хоста
        iifname { "docker0", "virbr0", "lxcbr0" } accept
        iifname "br-*" accept

        jump allow

        # Остальное тихо отбрасываем, раз в минуту пишем в журнал
        limit rate 1/minute burst 5 packets log prefix "cyberdeck-fw drop: " level info
    }
}

include "/etc/cyberdeck/nftables.d/*.nft"
