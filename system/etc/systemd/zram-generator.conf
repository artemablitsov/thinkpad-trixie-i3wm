# Cyberdeck: сжатый swap в памяти (zram).
# Под нагрузкой (Docker, браузер, VS Code) редко используемые страницы сжимаются
# в RAM (zstd, в 3–4 раза) вместо записи на SSD — быстрее и бережёт диск.
# Swap-файл (приоритет 10) остаётся для гибернации и как запас, если zram
# заполнится; zram с приоритетом 100 используется первым. В образ гибернации
# zram не идёт (systemd его для гибернации не учитывает).
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
