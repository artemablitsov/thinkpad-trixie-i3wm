# Cyberdeck: подключили/отключили монитор — решает cyberdeck-monitors-hotplug:
# не трогает раскладку, пока мониторы погашены по простою (иначе уснувший
# монитор выключался в X и не просыпался), ждёт, пока события улягутся,
# незнакомый набор мониторов раскладывает горизонтально, проснувшиеся — заново
# включает сохранённым профилем. Пока открыт редактор раскладки — ничего.
[Unit]
# В пакете — «не чаще раза в 5 с»: второе событие пачки отбрасывалось, и
# раскладка застревала в промежуточном состоянии
StartLimitIntervalSec=0

[Service]
ExecStart=
ExecStart=/usr/local/sbin/cyberdeck-monitors-hotplug
