# Cyberdeck: для неизвестного (не сохранённого) набора мониторов — не «ничего не
# делать», а разложить экраны горизонтально. При закрытой крышке autorandr считает
# встроенный экран отключённым — останется только внешний.
[Service]
ExecStart=
ExecStart=/usr/bin/autorandr --batch --change --default horizontal
