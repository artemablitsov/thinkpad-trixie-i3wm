# Cyberdeck: крышкой управляет cyberdeck-lidd, простоем — cyberdeck-idle.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
# Кнопка питания: на экране входа — выключение. В сеансе i3 держит блокировку
# handle-power-key (systemd-inhibit), и кнопка открывает меню питания вместо
# мгновенного выключения (в неё встроен сканер отпечатков — нажать легко).
# Долгое нажатие (~4 с) выключает питание прошивкой ThinkPad в любом случае.
HandlePowerKey=poweroff
HandleSuspendKey=suspend-then-hibernate
HandleHibernateKey=hibernate
IdleAction=ignore
