# Cyberdeck: сон с последующей гибернацией (и от сети, и от батареи).
[Sleep]
AllowSuspend=yes
AllowHibernation=yes
AllowSuspendThenHibernate=yes
AllowHybridSleep=no
# Сон клавишей Fn+4: гибернация через HIBERNATE_AFTER_MIN (установщик подставляет
# из /etc/cyberdeck/power.conf). Простой, крышка и меню питания задают свою задержку.
HibernateDelaySec=180min
HibernateOnACPower=yes
