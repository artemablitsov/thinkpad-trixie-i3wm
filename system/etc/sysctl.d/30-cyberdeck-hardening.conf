# Cyberdeck: усиление ядра без потерь для ноутбука разработчика.

# Программа может отлаживать (читать память) только свои дочерние процессы.
# Вредонос, запущенный от вашего имени, не прочитает память браузера, ssh-agent
# или менеджера паролей. Отладка уже запущенного процесса: sudo gdb -p / sudo strace -p.
kernel.yama.ptrace_scope = 1

# Адреса ядра в /proc скрыты от обычных пользователей (мешают обходу KASLR)
kernel.kptr_restrict = 1

# Журнал ядра (dmesg) — только root
kernel.dmesg_restrict = 1
