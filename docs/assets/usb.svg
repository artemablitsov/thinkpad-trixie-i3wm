<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="t d">
  <title id="t">Ejecting USB drives one at a time</title>
  <desc id="d">Illustration: the USB segment on the panel and the eject menu under it — click a drive to eject just that one.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#3B4252"/></pattern>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="125%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace; font-size: 13px; white-space: pre; }
    .b { font-weight: 700; } .ui { font-size: 15px; }
  </style>
  <rect width="1280" height="330" rx="12" fill="#2E3440"/>
  <rect width="1280" height="330" rx="12" fill="url(#dots)"/>

  <!-- panel -->
  <rect x="0" y="0" width="1280" height="28" fill="#2E3440" fill-opacity="0.85"/>
  <rect x="0" y="0" width="22" height="28" fill="#88C0D0"/>
  <text x="7" y="18" fill="#2E3440" class="b">1</text>
  <text x="29" y="18" fill="#D8DEE9">2</text>
  <text x="410" y="18" fill="#D8DEE9">Wed 28.10.2026  <tspan fill="#88C0D0" class="b">08:10</tspan></text>
  <rect x="611" y="3" width="64" height="22" rx="3" fill="#3B4252" stroke="#EBCB8B" stroke-width="1.5"/>
  <text x="618" y="18" fill="#88C0D0">USB:</text><text x="656" y="18" fill="#D8DEE9">3</text>
  <text x="680" y="18" fill="#434C5E">│</text>
  <text x="694" y="18" fill="#81A1C1">wifi</text><text x="730" y="18" fill="#D8DEE9">Home</text>
  <text x="772" y="18" fill="#434C5E">│</text>
  <text x="786" y="18" fill="#81A1C1">bt</text><text x="808" y="18" fill="#D8DEE9">---</text>
  <text x="838" y="18" fill="#434C5E">│</text>
  <text x="852" y="18" fill="#88C0D0">VOL:</text><text x="890" y="18" fill="#D8DEE9">45%</text>
  <text x="922" y="18" fill="#434C5E">│</text>
  <text x="936" y="18" fill="#88C0D0">CPU/RAM:</text><text x="1008" y="18" fill="#D8DEE9">4%/37%</text>
  <text x="1062" y="18" fill="#434C5E">│</text>
  <text x="1076" y="18" fill="#D8DEE9">48°C</text>
  <text x="1114" y="18" fill="#88C0D0">EN</text>
  <text x="1138" y="18" fill="#D8DEE9">87% <tspan fill="#EBCB8B">balanced</tspan></text>
  <!-- курсор на USB: -->
  <path d="M652 14l0 14 4-4 3 7 3-1-3-7 5 0z" fill="#ECEFF4" stroke="#2E3440" stroke-width="1"/>

  <!-- rofi: выпадающее меню под панелью, у правого края -->
  <g filter="url(#sh)">
    <rect x="652" y="36" width="620" height="140" fill="#2E3440" stroke="#88C0D0" stroke-width="2"/>
  </g>
  <g class="ui">
    <rect x="666" y="50" width="592" height="38" fill="#88C0D0"/>
    <text x="678" y="74" fill="#2E3440" class="ui b">⏏  KINGSTON  ·  15.7G  ·  /media/artem/KINGSTON</text>
    <text x="678" y="118" fill="#D8DEE9" class="ui">⏏  Backup  ·  1.0T  ·  /media/artem/Backup</text>
    <text x="678" y="160" fill="#D8DEE9" class="ui">⏏  SD card  ·  63.9G  ·  not mounted</text>
  </g>

  <!-- уведомление dunst после клика -->
  <text x="652" y="206" fill="#4C566A">after the click:</text>
  <g filter="url(#sh)">
    <rect x="652" y="216" width="420" height="72" fill="#3B4252" stroke="#88C0D0" stroke-width="2"/>
  </g>
  <text x="670" y="242" fill="#ECEFF4" class="b">KINGSTON can be removed</text>
  <text x="670" y="266" fill="#D8DEE9">/dev/sda · 15.7G</text>

  <text x="24" y="312" fill="#81A1C1">"USB:" is on the panel only while a drive is in · a click on a line ejects just that drive</text>
</svg>
