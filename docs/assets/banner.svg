<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">Cyberdeck</title>
  <desc id="d">Cyberdeck: ThinkPad, Debian 13, i3, Nord, TUI-first</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E3440"/>
      <stop offset="1" stop-color="#242933"/>
    </linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FBCBB"/>
      <stop offset="0.35" stop-color="#88C0D0"/>
      <stop offset="0.7" stop-color="#81A1C1"/>
      <stop offset="1" stop-color="#5E81AC"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#3B4252" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="14" fill="url(#grid)" opacity="0.55"/>
  <!-- терминальная рамка -->
  <g font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace">
    <rect x="40" y="36" width="1120" height="228" rx="8" fill="#2E3440" fill-opacity="0.82" stroke="#434C5E"/>
    <circle cx="64" cy="58" r="5" fill="#BF616A"/>
    <circle cx="82" cy="58" r="5" fill="#EBCB8B"/>
    <circle cx="100" cy="58" r="5" fill="#A3BE8C"/>
    <text x="600" y="62" fill="#4C566A" font-size="13" text-anchor="middle">~/.cyberdeck — sudo ./install.sh</text>
    <text x="600" y="150" fill="url(#frost)" font-size="64" font-weight="700" text-anchor="middle" letter-spacing="18">CYBERDECK</text>
    <text x="600" y="196" fill="#D8DEE9" font-size="18" text-anchor="middle">ThinkPad · Debian 13 · i3 · Nord · TUI-first</text>
    <text x="72" y="244" fill="#88C0D0" font-size="15">❯</text>
    <text x="92" y="244" fill="#E5E9F0" font-size="15">one command from a bare Debian to a finished desktop</text>
    <rect x="566" y="231" width="9" height="17" fill="#88C0D0">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- палитра Nord -->
  <g>
    <rect x="1000" y="236" width="18" height="12" fill="#BF616A"/>
    <rect x="1020" y="236" width="18" height="12" fill="#D08770"/>
    <rect x="1040" y="236" width="18" height="12" fill="#EBCB8B"/>
    <rect x="1060" y="236" width="18" height="12" fill="#A3BE8C"/>
    <rect x="1080" y="236" width="18" height="12" fill="#B48EAD"/>
    <rect x="1100" y="236" width="18" height="12" fill="#88C0D0"/>
    <rect x="1120" y="236" width="18" height="12" fill="#5E81AC"/>
  </g>
</svg>
