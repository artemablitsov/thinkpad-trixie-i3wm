# CYBERDECK · проверки при каждом push и pull request.
#   lint      — tools/check.sh (shellcheck, синтаксис, nftables, apt) в Debian 13
#   packages  — все пакеты из lib/packages.sh есть в Debian 13 (как на ноутбуке:
#               main contrib non-free non-free-firmware + backports)
#   vm        — полный прогон установщика в ВМ (tools/test-vm.sh), только вручную:
#               Actions → check → Run workflow → «vm». Около часа.
# Действия закреплены по SHA коммита (теги можно переписать).
name: check
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      vm:
        description: "Run the installer in a virtual machine (about an hour)"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1"   # weekly: did a package disappear from Debian?
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Check tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates shellcheck nftables python3 >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: tools/check.sh

  packages:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates curl >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Repositories as on the laptop (apt module)
        run: |
          useradd -m ci
          ./install.sh --user ci --only preflight,apt
      - name: All packages are available
        run: ./install.sh --check

  vm:
    if: github.event_name == 'workflow_dispatch' && inputs.vm
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: KVM for the VM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils >/dev/null
      - run: tools/test-vm.sh --mem 6144 --cpus 4
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: vm-logs
          path: ~/.cache/cyberdeck-vm/*.log
