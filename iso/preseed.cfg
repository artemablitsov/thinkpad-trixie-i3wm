#_preseed_V1
# Cyberdeck: ответы установщику Debian (debian-installer) для образа из tools/make-iso.sh.
#
# Заполнено всё, что одинаково для любого Cyberdeck: зеркало,
# репозитории, «без рабочего стола», шифрованный LVM. Установщик по-прежнему
# СПРАШИВАЕТ то, что решает только человек:
#   • язык, страну (от неё — форматы дат и чисел) и раскладку клавиатуры;
#   • часовой пояс;
#   • имя компьютера;
#   • сеть Wi-Fi и её пароль;
#   • имя пользователя и его пароль (root без пароля — у пользователя sudo);
#   • диск и подтверждение, что его можно стереть;
#   • пароль шифрования диска.
# Язык, страну и раскладку установщик спрашивает до чтения этого файла, и
# Cyberdeck их сохраняет (late.sh → /etc/cyberdeck/locale.conf):
#   • язык   → язык системы (LANG);
#   • страна → форматы дат, чисел, денег (LC_TIME, LC_NUMERIC…): English + Russia
#              — интерфейс английский, форматы русские;
#   • раскладка → вторая раскладка рядом с us (Left Alt + Left Shift).
# Для страны без локали выбранного языка (English + Russia) установщик ещё
# спросит, на какую страну опереться, — это только для самого установщика.

# Дополнительные локали; нужные Cyberdeck сгенерирует сам
d-i localechooser/supported-locales multiselect en_US.UTF-8, ru_RU.UTF-8

# ── Сеть: Wi-Fi (сеть и пароль) и имя компьютера установщик спросит ──────
# (предлагаемое имя — cyberdeck, его можно заменить)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string cyberdeck
# seen false: значение — только подсказка, вопрос всё равно задаётся
d-i netcfg/get_hostname seen false
d-i netcfg/get_domain string
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean true

# ── Зеркало и репозитории ──────────────────────────────────────────────
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/use_mirror boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates

# ── Пользователь: root без пароля (заблокирован), первый пользователь — в sudo ──
d-i passwd/root-login boolean false

# ── Часы: часовой пояс установщик спросит (по выбранной стране) ─────────
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# ── Диск: «весь диск, шифрованный LVM, всё в одном разделе» ────────────
# Какой диск — и согласие его стереть — установщик спросит. Пароль шифрования тоже.
# Раздел подкачки установщик создаёт сам; модуль power пишет в него образ
# гибернации, если он не меньше объёма RAM, иначе делает swap-файл.
d-i partman-auto/method string crypto
d-i partman-auto/choose_recipe select atomic
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/new_vg_name string cyberdeck-vg

# ── Программы: только «стандартные утилиты», без рабочего стола ─────────
# Всё остальное (i3, Nord, программы) ставит Cyberdeck при первом запуске.
tasksel tasksel/first multiselect standard
d-i pkgsel/include string ca-certificates curl git rsync
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false
d-i pkgsel/run_tasksel boolean true

# ── Загрузчик ──────────────────────────────────────────────────────────
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

# ── Cyberdeck: репозиторий в ~/.cyberdeck и установка при первой загрузке ──
d-i preseed/late_command string sh /cdrom/cyberdeck/late.sh

# Без последнего «извлеките диск и нажмите Continue» — сразу перезагрузка
d-i finish-install/reboot_in_progress note
